# SpecForge smoke config: OmniSVG 8B DFlash head, OFFLINE COLOCATED, 1 GPU.
# SMOKE ONLY — data is T1 sample-b8 outputs (bench prompts; pipeline bring-up,
# never real training). Real-run config comes after this passes.
model:
  target_model_path: $SIGHTLINE_MODELS/OmniSVG1.1_8B-qwen2-text
  draft_model_config: omnisvg-8b-dflash-draft.json
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  hidden_states_path: runs/2026-10-09-t7-smoke/hidden_states
  max_length: 2048
  chat_template: qwen
  cache_dir: runs/2026-10-09-t7-smoke/cache

training:
  strategy: dflash
  num_epochs: 1
  max_steps: 30            # smoke: just prove the loop runs and loss is sane
  batch_size: 4
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  save_interval: 30
  log_interval: 1
  dist_timeout: 30
  seed: 42

run_id: omnisvg-8b-dflash-smoke
output_dir: runs/2026-10-09-t7-smoke/outputs

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
